name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sentinel_test
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c constraints.txt -e '.[dev]'
      - run: ruff check . && ruff format --check . && mypy
      - run: pytest -q
      - run: alembic upgrade head && alembic check && pytest -q tests/integration
        env:
          SENTINEL_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1/sentinel_test
          SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1/sentinel_test
      - name: Compose startup and demo
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          docker compose up --build --wait
          python scripts/demo.py
          docker compose down -v
