[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai-lab"
version = "0.1.0"
description = "Evidence-driven security assessments for authorized AI applications"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
 "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2",
 "psycopg[binary]>=3.2,<4", "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]
dashboard = ["streamlit>=1.42,<2"]

[tool.setuptools.packages.find]
include = ["app*", "scenarios*"]

[tool.setuptools.package-data]
scenarios = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4","E7","E9","F","I","B","ASYNC"]
